name: enterprise-finance-agent

services:
  database:
    build:
      context: .
      dockerfile: deploy/Dockerfile.database
    image: enterprise-finance-agent/database:1.0.0
    environment:
      MYSQL_ROOT_PASSWORD: ${M7_MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set M7_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: saa_data_agent
      ENTERPRISE_DEMO_READONLY_PASSWORD: ${ENTERPRISE_DEMO_READONLY_PASSWORD:?Copy .env.example to .env and set ENTERPRISE_DEMO_READONLY_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${M7_MYSQL_PORT:-3307}:3306"
    volumes:
      - management_and_demo_mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=socket --user=root
          --silent --skip-column-names
          --execute='SELECT ready FROM enterprise_demo.demo_generation_ready WHERE id = 1'
          2>/dev/null | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped
    networks:
      - data-agent

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    image: enterprise-finance-agent/backend:1.0.0
    environment:
      DATA_AGENT_DATASOURCE_URL: jdbc:mysql://database:3306/saa_data_agent?useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
      DATA_AGENT_DATASOURCE_USERNAME: root
      DATA_AGENT_DATASOURCE_PASSWORD: ${M7_MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set M7_MYSQL_ROOT_PASSWORD}
      DATA_AGENT_DATASOURCE_SQL_INIT: always
      LANGFUSE_ENABLED: "false"
      TZ: Asia/Shanghai
    ports:
      - "${M7_BACKEND_PORT:-8065}:8065"
    volumes:
      - backend_uploads:/app/uploads
      - backend_vectorstore:/app/vectorstore
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8065/api/agent/list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - data-agent

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    image: enterprise-finance-agent/frontend:1.0.0
    ports:
      - "${M7_FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - data-agent

volumes:
  management_and_demo_mysql:
  backend_uploads:
  backend_vectorstore:

networks:
  data-agent:
    driver: bridge
